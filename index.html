<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARS - Community Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #F7F7F5; --text-main: #1A362B; --text-muted: #5C7165;
      --accent-blue: #D0DBFF; --accent-yellow: #E7FF7D; --accent-red: #FF6B6B;
      --accent-green: #A8FF9F; --border-color: #1A362B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { 
      background-color: var(--bg); color: var(--text-main); overflow: hidden;
      background-image: linear-gradient(rgba(26, 54, 43, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(26, 54, 43, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      cursor: crosshair;
    }

    /* --- TOAST NOTIFICATIONS --- */
    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: #fff; border: 3px solid var(--border-color); border-radius: 8px; padding: 15px 20px; font-weight: 800; color: var(--text-main); box-shadow: 4px 4px 0 var(--border-color); animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* --- CONFETTI CANVAS --- */
    #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }

    /* --- AUTH OVERLAY --- */
    #auth-overlay { position: fixed; inset: 0; background: rgba(26, 54, 43, 0.95); z-index: 10001; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .auth-box { background: var(--bg); border: 4px solid var(--border-color); border-radius: 16px; padding: 40px; width: 90%; max-width: 400px; text-align: center; box-shadow: 8px 8px 0 var(--accent-yellow); animation: popIn 0.5s; }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .auth-box h1 { font-size: 36px; font-weight: 800; margin-bottom: 10px; }
    .auth-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
    .auth-box input { width:100%; padding:12px; border:2px solid #ccc; border-radius:8px; margin-bottom:10px; font-family:inherit; font-size:16px; outline:none;}
    .auth-box button { width: 100%; padding: 14px; background: var(--text-main); color: #fff; border: none; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .auth-box button:hover { background: #2a5041; transform: translateY(-2px); }

    /* --- APP LAYOUT --- */
    #app-container { display: none; height: 100vh; width: 100vw; }

    /* FLOATING SIDEBAR */
    .floating-sidebar {
      position: fixed; left: 20px; top: 50%; transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
      border: 3px solid var(--border-color); border-radius: 20px;
      padding: 15px 10px; display: flex; flex-direction: column; gap: 15px;
      box-shadow: 5px 5px 0 rgba(0,0,0,0.1); z-index: 100;
    }
    .logo-btn { width: 50px; height: 50px; border-radius: 12px; background: #fff; border: 3px solid var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; user-select: none; overflow: hidden; padding: 4px;}
    .logo-btn img { width: 100%; height: 100%; object-fit: contain; }
    .logo-btn:active { transform: scale(0.9); }
    
    .channel-nav { display: flex; flex-direction: column; gap: 8px; }
    .channel { width: 50px; height: 50px; border-radius: 12px; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: 0.2s; position: relative; }
    .channel:hover { background: rgba(0,0,0,0.05); }
    .channel.active { background: var(--accent-blue); border-color: var(--border-color); }
    .channel::after { content: attr(data-tooltip); position: absolute; left: 60px; background: var(--text-main); color: #fff; font-size: 12px; font-weight: 800; padding: 4px 8px; border-radius: 4px; opacity: 0; pointer-events: none; transition: 0.2s; white-space: nowrap; transform: translateX(-10px); }
    .channel:hover::after { opacity: 1; transform: translateX(0); }

    .user-badge { width: 50px; height: 50px; border-radius: 50%; background: var(--accent-green); border: 3px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; cursor: pointer; overflow: hidden; padding: 2px; }
    .user-badge img { width: 100%; height: 100%; object-fit: contain; }

    /* MAIN CONTENT */
    .main-content { margin-left: 110px; height: 100%; display: flex; flex-direction: column; }
    
    .header { padding: 30px 40px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid transparent; }
    .header h2 { font-size: 32px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .play-btn { background: var(--accent-blue); color: var(--text-main); padding: 12px 24px; border-radius: 30px; text-decoration: none; font-weight: 800; border: 3px solid var(--border-color); transition: 0.2s; box-shadow: 3px 3px 0 var(--border-color); font-size: 16px; }
    .play-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--border-color); background: #fff; }

    .feed-area { flex: 1; overflow-y: auto; padding: 20px 40px 40px; display: flex; flex-direction: column; gap: 25px; }

    /* --- SLIDER --- */
    .slider-wrapper { width: 100%; max-width: 900px; border-radius: 16px; overflow: hidden; border: 4px solid var(--border-color); position: relative; aspect-ratio: 21 / 9; box-shadow: 6px 6px 0 var(--accent-blue); background: #000; }
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s; }
    .slide.active { opacity: 1; }
    .slide img { width: 100%; height: 100%; object-fit: cover; }
    .slide-text { position: absolute; bottom: 20px; left: 20px; background: var(--accent-yellow); padding: 10px 20px; border: 3px solid var(--border-color); border-radius: 8px; font-weight: 800; font-size: 20px; box-shadow: 3px 3px 0 var(--border-color); }

    /* --- POST FORM (Inline) --- */
    .post-form { display: flex; gap: 10px; width: 100%; max-width: 900px; background: #fff; border: 3px solid var(--border-color); border-radius: 16px; padding: 15px; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); transition: 0.2s; }
    .post-form:focus-within { box-shadow: 6px 6px 0 var(--accent-yellow); transform: translate(-2px, -2px); }
    .post-form input { flex: 1; padding: 12px 16px; border: 2px solid #E0E0E0; border-radius: 8px; font-family: inherit; font-size: 16px; outline: none; background: var(--bg); transition: 0.2s; }
    .post-form input:focus { border-color: var(--text-main); background: #fff; }
    .post-form button { background: var(--text-main); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .post-form button:hover { background: #2a5041; transform: scale(1.05); }

    /* --- POSTS --- */
    .post-card { background: #fff; border: 3px solid var(--border-color); border-radius: 16px; padding: 25px; max-width: 900px; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); animation: slideUp 0.4s ease-out forwards; opacity: 0; transform: translateY(20px); transition: transform 0.2s, box-shadow 0.2s; }
    .post-card:hover { transform: translateY(-4px) rotate(0.3deg); box-shadow: 7px 7px 0 var(--border-color); }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

    .post-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
    .post-user { display: flex; align-items: center; gap: 12px; }
    .post-avatar { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; border: 3px solid var(--border-color); background: #fff; overflow: hidden; padding: 2px; }
    .post-avatar img { width: 100%; height: 100%; object-fit: contain; }
    .post-author { font-weight: 800; font-size: 18px; }
    .post-date { font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .post-content { font-size: 16px; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; color: var(--text-main); }

    /* INTERACTIONS */
    .post-actions { display: flex; gap: 12px; border-top: 2px solid #F0F0F0; padding-top: 15px; }
    .action-btn { background: var(--bg); border: 2px solid #E0E0E0; border-radius: 20px; padding: 6px 14px; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; color: var(--text-main); }
    .action-btn:hover { border-color: var(--text-main); background: #fff; transform: scale(1.05); }
    .action-btn:active { transform: scale(0.95); }
    .action-btn.liked { background: var(--accent-green); border-color: var(--border-color); }
    .action-btn.disliked { background: var(--accent-red); border-color: var(--border-color); color: #fff;}

    /* COMMENTS SECTION */
    .comments-section { display: none; margin-top: 20px; border-top: 2px dashed #ccc; padding-top: 20px; }
    .comment-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .comment-item { background: var(--bg); padding: 10px 15px; border-radius: 8px; border: 2px solid #E0E0E0; }
    .comment-author { font-weight: 800; font-size: 13px; color: var(--text-main); margin-bottom: 2px; }
    .comment-text { font-size: 14px; }
    .comment-input-area { display: flex; gap: 10px; }
    .comment-input-area input { flex: 1; padding: 8px 15px; border: 2px solid #E0E0E0; border-radius: 20px; outline: none; font-family: inherit; font-size: 14px;}
    .comment-input-area input:focus { border-color: var(--text-main); }
    .comment-input-area button { background: var(--text-main); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 800; cursor: pointer; transition: 0.2s;}
    .comment-input-area button:hover { transform: scale(1.05); }

    /* --- SECRET BLOCK --- */
    #secret-block { position: fixed; bottom: -60px; left: 20px; width: 45px; height: 45px; background: #8B5A2B; border: 3px solid var(--border-color); cursor: pointer; transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); }
    #secret-block.show { bottom: 20px; transform: rotate(15deg); }
    #secret-block:hover { transform: rotate(0deg) scale(1.1); }

    /* CURSOR TRAIL */
    .trail-dot { position: fixed; width: 10px; height: 10px; background: var(--accent-yellow); border: 2px solid var(--border-color); border-radius: 2px; pointer-events: none; z-index: 9998; transition: transform 0.1s ease-out, opacity 0.5s; }

    @media (max-width: 800px) {
      .floating-sidebar { left: 10px; padding: 10px 5px; gap: 10px; }
      .channel, .logo-btn, .user-badge { width: 40px; height: 40px; font-size: 18px; }
      .channel::after { display: none; }
      .main-content { margin-left: 70px; }
      .feed-area { padding: 15px; }
      .header h2 { font-size: 24px; }
      .post-form { flex-direction: column; }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>
  <div id="toast-container"></div>

  <!-- AUTH OVERLAY -->
  <div id="auth-overlay">
    <div class="auth-box">
      <h1>WARS</h1>
      <p>Enter a username and password to join.</p>
      <input type="text" id="auth-user" placeholder="Username" maxlength="20">
      <input type="password" id="auth-pass" placeholder="Password">
      <button onclick="login()">Enter the Hub</button>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
    <div style="background: var(--bg); border: 4px solid var(--border-color); border-radius: 16px; padding: 30px; width: 90%; max-width: 400px; box-shadow: 8px 8px 0 var(--accent-blue);">
      <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 20px;">⚙️ Settings</h2>
      <p style="font-size: 15px; font-weight: 600; margin-bottom: 10px;">Username: <strong id="set-user" style="font-family: monospace; background: #fff; padding: 2px 6px; border: 1px solid #ccc;"></strong></p>
      <p style="font-size: 15px; font-weight: 600; margin-bottom: 10px;">Password: <strong id="set-pass" style="font-family: monospace; background: #fff; padding: 2px 6px; border: 1px solid #ccc;"></strong></p>
      <p style="margin-top: 15px; color: var(--text-muted); font-size: 13px;">Keep this secret!</p>
      <button onclick="closeSettings()" style="margin-top: 25px; background: var(--accent-red); color: #fff; border: 3px solid var(--border-color); padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; transition: 0.2s;">Close</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app-container">
    <!-- FLOATING SIDEBAR -->
    <aside class="floating-sidebar">
      <div class="logo-btn" onclick="spinLogo()">
        <img src="assets/wars_fr_home_upright.png" alt="W" onerror="this.style.display='none'; this.parentElement.innerText='⚔️'">
      </div>
      
      <div class="channel-nav">
        <div class="channel active" data-channel="announcements" data-tooltip="Announcements" onclick="switchChannel('announcements')">📢</div>
        <div class="channel" data-channel="guides" data-tooltip="Guides" onclick="switchChannel('guides')">📖</div>
        <div class="channel" data-channel="general" data-tooltip="General Chat" onclick="switchChannel('general')">💬</div>
        <div class="channel" data-channel="lfg" data-tooltip="LFG" onclick="switchChannel('lfg')">🎮</div>
        <div class="channel" data-channel="bugs" data-tooltip="Bug Reports" onclick="switchChannel('bugs')">🐛</div>
      </div>

      <div class="user-badge" onclick="openSettings()" title="Settings">
        <img src="assets/default.png" alt="User" onerror="this.style.display='none'; this.parentElement.innerText='U'">
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="header">
        <h2 id="channel-title">📢 Announcements</h2>
        <a href="https://guns.lol/devvingwars" target="_blank" class="play-btn">Play WARS</a>
      </header>

      <div class="feed-area" id="feed-area">
        
        <!-- SLIDER (Only in Announcements) -->
        <div class="slider-wrapper" id="main-slider">
          <div class="slide active">
            <img src="assets/1765.png" alt="1765" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1000'">
            <div class="slide-text">🌲 Welcome to the WARS Community!</div>
          </div>
          <div class="slide">
            <img src="assets/5114.png" alt="5114" onerror="this.src='https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1000'">
            <div class="slide-text">🌊 Explore the Deep</div>
          </div>
          <div class="slide">
            <img src="assets/hiddendepths.png" alt="hiddendepths" onerror="this.src='https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=1000'">
            <div class="slide-text">⚔️ Epic Battles Await</div>
          </div>
        </div>

        <!-- INLINE POST FORM -->
        <div class="post-form" id="post-form" style="display:none;">
          <input type="text" id="post-message" placeholder="Type a message..." required>
          <button onclick="submitPost()">Send</button>
        </div>

        <div id="feed-container" style="display:flex; flex-direction:column; gap:20px; width:100%; max-width:900px;">
          <p id="loadingText">Loading posts...</p>
        </div>

      </div>
    </main>
  </div>

  <!-- SECRET BLOCK -->
  <div id="secret-block" onclick="activateSuperSecret()"></div>

  <script>
    // --- CONFIG & AUTH ---
    const SUPABASE_URL = "https://rmtzmdjpvzrwrionhdeb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_yNU_5dsH-ZPfRu6MtZLeig_8CQzme9H";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = localStorage.getItem('wars_user');
    let currentPass = localStorage.getItem('wars_pass');
    let logoClicks = 0;

    function login() {
      const user = document.getElementById('auth-user').value.trim();
      const pass = document.getElementById('auth-pass').value.trim();
      if(!user || !pass) return showToast("Please enter a username and password!");
      
      localStorage.setItem('wars_user', user);
      localStorage.setItem('wars_pass', pass);
      currentUser = user;
      currentPass = pass;
      initApp();
    }

    function initApp() {
      if(!currentUser || !currentPass) return;
      document.getElementById('auth-overlay').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      document.getElementById('set-user').textContent = currentUser;
      document.getElementById('set-pass').textContent = currentPass;

      loadPosts();
      setInterval(nextSlide, 4000);
      
      setTimeout(() => { document.getElementById('secret-block').classList.add('show'); }, 8000);
    }

    if(currentUser && currentPass) initApp();

    // --- TOAST SYSTEM ---
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = '0.5s'; setTimeout(() => toast.remove(), 500); }, 3000);
    }

    // --- CHANNELS & POSTS ---
    let currentChannel = 'announcements';
    const channelNames = {
      'announcements': '📢 Announcements', 'guides': '📖 Guides',
      'general': '💬 General Chat', 'lfg': '🎮 LFG', 'bugs': '🐛 Bug Reports'
    };

    function switchChannel(channel) {
      currentChannel = channel;
      document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
      document.querySelector(`.channel[data-channel="${channel}"]`).classList.add('active');
      document.getElementById('channel-title').textContent = channelNames[channel];
      
      document.getElementById('main-slider').style.display = channel === 'announcements' ? 'block' : 'none';
      document.getElementById('post-form').style.display = channel === 'announcements' ? 'none' : 'flex';
      
      loadPosts();
    }

    async function loadPosts() {
      const container = document.getElementById('feed-container');
      container.innerHTML = '<p id="loadingText">Loading...</p>';
      
      try {
        let tagFilter = '';
        if(currentChannel === 'guides') tagFilter = 'Guide';
        if(currentChannel === 'lfg') tagFilter = 'LFG';
        if(currentChannel === 'bugs') tagFilter = 'Bug Report';
        if(currentChannel === 'general') tagFilter = 'General';
        if(currentChannel === 'announcements') tagFilter = 'Announcement';

        let query = _supabase.from('posts').select('*').order('created_at', { ascending: false });
        if(tagFilter) query = query.eq('tag', tagFilter);

        const { data, error } = await query;
        if(error) throw error;
        
        container.innerHTML = '';
        
        if(data.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted); font-weight:600; text-align:center; margin-top:20px;">No messages here yet. Start the conversation!</p>';
          return;
        }

        data.forEach((post, i) => {
          const card = document.createElement('div');
          card.className = 'post-card';
          card.style.animationDelay = `${i * 0.05}s`;
          
          const date = new Date(post.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          const initial = post.username.charAt(0).toUpperCase();
          const avatarBg = getAvatarColor(post.username);
          const comments = post.comments || [];
          const commentsHtml = comments.map(c => `
            <div class="comment-item">
              <div class="comment-author">${escapeHTML(c.user)}</div>
              <div class="comment-text">${escapeHTML(c.text)}</div>
            </div>
          `).join('');

          card.innerHTML = `
            <div class="post-header">
              <div class="post-user">
                <div class="post-avatar" style="background:${avatarBg}">${initial}</div>
                <div>
                  <div class="post-author">${escapeHTML(post.username)}</div>
                  <div class="post-date">${date}</div>
                </div>
              </div>
            </div>
            <div class="post-content">${escapeHTML(post.message)}</div>
            <div class="post-actions">
              <button class="action-btn ${post.likes > 0 ? 'liked' : ''}" onclick="react(this, '${post.id}', 'likes')">
                👍 <span id="likes-${post.id}">${post.likes || 0}</span>
              </button>
              <button class="action-btn ${post.dislikes > 0 ? 'disliked' : ''}" onclick="react(this, '${post.id}', 'dislikes')">
                👎 <span id="dislikes-${post.id}">${post.dislikes || 0}</span>
              </button>
              <button class="action-btn" onclick="toggleComments('${post.id}')">
                💬 Comments (${comments.length})
              </button>
            </div>
            <div class="comments-section" id="comments-${post.id}">
              <div class="comment-list" id="comment-list-${post.id}">${commentsHtml}</div>
              <div class="comment-input-area">
                <input type="text" id="comment-input-${post.id}" placeholder="Reply...">
                <button onclick="addComment('${post.id}')">Send</button>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="color:red; font-weight:bold;">Database Error: Did you run the SQL update in Supabase?</p>';
      }
    }

    async function submitPost() {
      const input = document.getElementById('post-message');
      const msg = input.value.trim();
      if(!msg) return;
      
      let tag = 'General';
      if(currentChannel === 'guides') tag = 'Guide';
      if(currentChannel === 'lfg') tag = 'LFG';
      if(currentChannel === 'bugs') tag = 'Bug Report';

      try {
        const { error } = await _supabase.from('posts').insert([{
          username: currentUser, tag: tag, message: msg, likes: 0, dislikes: 0, comments: []
        }]);
        if(error) throw error;
        input.value = '';
        fireConfetti();
        loadPosts();
      } catch (err) { showToast("Error: " + err.message); }
    }

    async function react(btn, id, type) {
      const numEl = document.getElementById(`${type}-${id}`);
      let current = parseInt(numEl.textContent) || 0;
      numEl.textContent = current + 1;
      btn.classList.add(type === 'likes' ? 'liked' : 'disliked');
      
      try {
        const { data } = await _supabase.from('posts').select(type).eq('id', id).single();
        await _supabase.from('posts').update({ [type]: data[type] + 1 }).eq('id', id);
      } catch(e) { showToast("Error saving reaction."); }
    }

    function toggleComments(id) {
      const sec = document.getElementById(`comments-${id}`);
      sec.style.display = sec.style.display === 'block' ? 'none' : 'block';
    }

    async function addComment(id) {
      const input = document.getElementById(`comment-input-${id}`);
      const text = input.value.trim();
      if(!text) return;

      try {
        const { data, error } = await _supabase.from('posts').select('comments').eq('id', id).single();
        if(error) throw error;
        
        const existing = data.comments || [];
        existing.push({ user: currentUser, text: text });

        await _supabase.from('posts').update({ comments: existing }).eq('id', id);
        
        const list = document.getElementById(`comment-list-${id}`);
        const div = document.createElement('div');
        div.className = 'comment-item';
        div.innerHTML = `<div class="comment-author">${escapeHTML(currentUser)}</div><div class="comment-text">${escapeHTML(text)}</div>`;
        list.appendChild(div);
        input.value = '';
      } catch(err) { showToast("Error adding comment."); }
    }

    // --- INTERACTIVITY ---
    function spinLogo() {
      logoClicks++;
      const logo = document.querySelector('.logo-btn');
      logo.style.transform = `rotate(${logoClicks * 90}deg)`;
      if(logoClicks >= 5) { fireConfetti(); logoClicks = 0; setTimeout(() => logo.style.transform = 'rotate(0deg)', 1000); }
    }

    function activateSuperSecret() {
      document.getElementById('secret-block').classList.remove('show');
      showToast("🧱 You found the lost block! The universe is balanced.");
      fireConfetti();
    }

    // --- CONFETTI ---
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

    function fireConfetti() {
      for(let i=0; i<50; i++) {
        particles.push({ x: window.innerWidth / 2, y: window.innerHeight / 2, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 1) * 20, size: Math.random() * 8 + 4, color: pastelColors[Math.floor(Math.random() * pastelColors.length)], life: 1 });
      }
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.life -= 0.02;
        if(p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      requestAnimationFrame(updateConfetti);
    }
    updateConfetti();

    // --- UTILS ---
    const pastelColors = ['#FF9F9F', '#FFC89F', '#FFE79F', '#C4FF9F', '#9FFFE0', '#9FC4FF', '#C89FFF', '#FF9FE0'];
    function getAvatarColor(name) { let hash = 0; for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash); return pastelColors[Math.abs(hash) % pastelColors.length]; }
    function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    let slideIndex = 0;
    function nextSlide() {
      const slides = document.querySelectorAll('.slide');
      if(slides.length === 0) return;
      slides[slideIndex].classList.remove('active');
      slideIndex = (slideIndex + 1) % slides.length;
      slides[slideIndex].classList.add('active');
    }

    document.addEventListener('mousemove', (e) => {
      if(Math.random() > 0.8) {
        const dot = document.createElement('div');
        dot.className = 'trail-dot';
        dot.style.left = e.clientX + 'px';
        dot.style.top = e.clientY + 'px';
        document.body.appendChild(dot);
        setTimeout(() => { dot.style.opacity = '0'; setTimeout(() => dot.remove(), 500); }, 100);
      }
    });
  </script>
</body>
</html>
