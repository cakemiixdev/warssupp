<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARS - Community Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #F7F7F5;
      --text-main: #1A362B; /* Deep forest green */
      --text-muted: #5C7165;
      --accent-blue: #D0DBFF;
      --accent-yellow: #E7FF7D;
      --border-color: #1A362B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); overflow-x: hidden; }

    /* --- HEADER --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 5%;
      max-width: 1400px;
      margin: 0 auto;
    }
    .logo { font-size: 24px; font-weight: 800; letter-spacing: -1px; display: flex; align-items: center; gap: 8px;}
    .logo span { color: var(--text-main); }
    .logo-icon { font-size: 28px; }
    
    nav { display: flex; gap: 30px; font-size: 15px; font-weight: 600; }
    nav a { text-decoration: none; color: var(--text-main); transition: opacity 0.2s; cursor: pointer; }
    nav a:hover { opacity: 0.6; }

    .btn-play {
      background: var(--accent-blue);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-play:hover { transform: scale(1.05); background: #b5c7ff; }

    /* --- HERO SECTION --- */
    .hero {
      text-align: center;
      padding: 80px 20px 40px;
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
    }
    .hero h1 {
      font-size: clamp(40px, 6vw, 72px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }
    
    .sketch-oval {
      position: relative;
      display: inline-block;
    }
    .sketch-oval svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120%;
      height: 140%;
      z-index: -1;
      stroke: var(--accent-blue);
      stroke-width: 8;
      fill: none;
      stroke-linecap: round;
    }

    /* --- DIVIDER LINE --- */
    .divider-container {
      width: 100%;
      padding: 0 5%;
      position: relative;
      margin-top: 40px;
    }
    .divider {
      height: 8px;
      background-color: var(--text-main);
      width: 100%;
      position: relative;
    }
    .divider::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 80px;
      background-color: var(--accent-yellow);
    }

    /* --- FORUM SECTION --- */
    .forum-wrapper {
      max-width: 1200px;
      margin: 60px auto;
      padding: 0 5%;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 40px;
    }

    .post-form {
      background: #fff;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 4px 4px 0 var(--border-color);
      height: fit-content;
      position: sticky;
      top: 20px;
    }
    .post-form h2 { font-size: 24px; font-weight: 800; margin-bottom: 20px; }
    
    input, textarea, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #E0E0E0;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
      background: var(--bg);
      color: var(--text-main);
    }
    input:focus, textarea:focus, select:focus { border-color: var(--text-main); }
    textarea { resize: vertical; min-height: 100px; }

    .btn-submit {
      width: 100%;
      background: var(--text-main);
      color: #fff;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #2a5041; }
    .btn-submit:disabled { background: #999; cursor: not-allowed; }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .feed-header h2 { font-size: 28px; font-weight: 800; }
    
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: #fff;
      border: 2px solid #E0E0E0;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--text-main); color: var(--text-main); }
    .filter-btn.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }

    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post-card {
      background: #fff;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 4px 4px 0 var(--border-color);
      animation: slideUp 0.4s ease-out forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    .post-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--border-color); transition: all 0.2s; }
    
    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .post-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .post-author { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .post-tag { 
      font-size: 11px; 
      font-weight: 800; 
      text-transform: uppercase; 
      padding: 4px 8px; 
      border-radius: 4px; 
      background: var(--accent-blue);
      color: var(--text-main);
    }
    .post-tag.guide { background: var(--accent-yellow); }
    .post-time { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .post-content { font-size: 15px; line-height: 1.5; color: var(--text-main); white-space: pre-wrap; }

    @media (max-width: 900px) {
      .forum-wrapper { grid-template-columns: 1fr; }
      .post-form { position: relative; top: 0; }
    }
    @media (max-width: 700px) {
      header { flex-direction: column; gap: 20px; }
      nav { display: none; }
      .hero h1 { font-size: 38px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span class="logo-icon">⚔️</span>
      <span>WARS</span>
    </div>
    <nav>
      <a onclick="setFilter('All')">Forum</a>
      <a onclick="setFilter('Guide')">Guides</a>
    </nav>
    <a href="https://guns.lol/devvingwars" target="_blank" class="btn-play">Play WARS</a>
  </header>

  <section class="hero">
    <h1>
      Unlock your <span class="sketch-oval">
        ultimate
        <svg viewBox="0 0 200 80" preserveAspectRatio="none">
          <path d="M 10,40 C 10,10 190,10 190,40 C 190,70 10,70 10,40" />
        </svg>
      </span> 
      WARS experience with the community.
    </h1>
  </section>

  <div class="divider-container">
    <div class="divider"></div>
  </div>

  <section class="forum-wrapper">
    <div class="post-form">
      <h2>Create a Post</h2>
      <form id="forumForm">
        <input type="text" id="username" placeholder="Your Username" required maxlength="20">
        <select id="tag">
          <option value="General">General Chat</option>
          <option value="LFG">LFG (Looking for Group)</option>
          <option value="Bug Report">Bug Report</option>
          <option value="Suggestion">Suggestion</option>
          <!-- Admin option will be injected here by JS -->
        </select>
        <textarea id="message" placeholder="What's on your mind?" required maxlength="500"></textarea>
        <button type="submit" id="submitBtn" class="btn-submit">Post to Forum</button>
      </form>
    </div>

    <div class="feed">
      <div class="feed-header">
        <h2>Latest Discussions</h2>
        <div class="filters">
          <button class="filter-btn active" data-filter="All" onclick="setFilter('All')">All</button>
          <button class="filter-btn" data-filter="General" onclick="setFilter('General')">General</button>
          <button class="filter-btn" data-filter="LFG" onclick="setFilter('LFG')">LFG</button>
          <button class="filter-btn" data-filter="Bug Report" onclick="setFilter('Bug Report')">Bugs</button>
          <button class="filter-btn" data-filter="Guide" onclick="setFilter('Guide')">Guides</button>
        </div>
      </div>
      
      <div id="feedContainer" class="feed-container">
        <p id="loadingText" style="color: var(--text-muted); font-weight: 600;">Loading posts...</p>
      </div>
    </div>
  </section>

  <script>
    // Supabase Config
    const SUPABASE_URL = "https://rmtzmdjpvzrwrionhdeb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_yNU_5dsH-ZPfRu6MtZLeig_8CQzme9H";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Admin Logic
    // If you go to your website with ?admin=true at the end, you unlock Guide posting.
    const isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';
    if (isAdmin) {
      document.getElementById('tag').innerHTML += '<option value="Guide">✨ Community Guide (Admin)</option>';
      document.getElementById('username').value = "DevvingWars"; // Auto-fill your name
    }

    let allPosts = [];
    let currentFilter = "All";

    async function loadPosts() {
      const feedContainer = document.getElementById('feedContainer');
      const loadingText = document.getElementById('loadingText');
      
      try {
        const { data, error } = await _supabase
          .from('posts')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        
        allPosts = data;
        loadingText.style.display = 'none';
        renderFeed();
      } catch (error) {
        console.error("Error loading posts: ", error);
        loadingText.textContent = "Could not load posts. Check Supabase table.";
      }
    }

    function renderFeed() {
      const feedContainer = document.getElementById('feedContainer');
      feedContainer.innerHTML = '';
      
      const filteredPosts = currentFilter === "All" 
        ? allPosts 
        : allPosts.filter(post => post.tag === currentFilter);

      if (filteredPosts.length === 0) {
        feedContainer.innerHTML = `<p style="color: var(--text-muted); font-weight: 600;">No ${currentFilter === "All" ? "" : currentFilter} posts found yet. Be the first!</p>`;
        return;
      }

      filteredPosts.forEach((post, index) => {
        const dateObj = new Date(post.created_at);
        const date = dateObj.toLocaleDateString();
        
        const card = document.createElement('div');
        card.className = 'post-card';
        card.style.animationDelay = `${index * 0.05}s`;
        
        // Special styling for guides
        const tagClass = post.tag === 'Guide' ? 'post-tag guide' : 'post-tag';
        
        card.innerHTML = `
          <div class="post-header">
            <div class="post-author">
              ${post.username}
              <span class="${tagClass}">${post.tag}</span>
            </div>
            <div class="post-time">${date}</div>
          </div>
          <div class="post-content">${escapeHTML(post.message)}</div>
        `;
        feedContainer.appendChild(card);
      });
    }

    document.getElementById('forumForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = "Posting...";

      const username = document.getElementById('username').value.trim();
      const tag = document.getElementById('tag').value;
      const message = document.getElementById('message').value.trim();

      try {
        const { error } = await _supabase
          .from('posts')
          .insert([{ username: username, tag: tag, message: message }]);

        if (error) throw error;
        
        document.getElementById('message').value = '';
        await loadPosts(); 
      } catch (error) {
        alert("Error posting: " + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Post to Forum";
      }
    });

    // Global function for navigation links
    window.setFilter = function(filterName) {
      currentFilter = filterName;
      
      // Update active button styling
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === filterName);
      });
      
      renderFeed();
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => setFilter(e.target.dataset.filter));
    });

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
          }[tag] || tag)
      );
    }

    loadPosts();
  </script>
</body>
</html>
