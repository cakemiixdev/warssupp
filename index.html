<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARS - Community Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #F7F7F5;
      --text-main: #1A362B; /* Deep forest green */
      --text-muted: #5C7165;
      --accent-blue: #D0DBFF;
      --accent-yellow: #E7FF7D;
      --accent-red: #FF6B6B;
      --border-color: #1A362B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      overflow-x: hidden; 
      /* Retro grid background */
      background-image: 
        linear-gradient(rgba(26, 54, 43, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 54, 43, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* --- HEADER --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 5%;
      max-width: 1400px;
      margin: 0 auto;
      position: sticky;
      top: 0;
      background: rgba(247, 247, 245, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 2px solid transparent;
      transition: border-color 0.3s;
    }
    header.scrolled { border-bottom-color: var(--border-color); }
    
    .logo { font-size: 24px; font-weight: 800; letter-spacing: -1px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .logo-icon { font-size: 28px; }
    
    nav { display: flex; gap: 30px; font-size: 15px; font-weight: 600; position: relative; }
    nav a { 
      text-decoration: none; 
      color: var(--text-main); 
      position: relative; 
      cursor: pointer;
      padding-bottom: 4px;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 3px;
      background: var(--text-main);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
      border-radius: 2px;
    }
    nav a:hover::after, nav a.active::after { transform: scaleX(1); transform-origin: left; }

    .btn-play {
      background: var(--accent-blue);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 2px solid transparent;
    }
    .btn-play:hover { 
      transform: translateY(-2px); 
      background: var(--text-main); 
      color: #fff;
      box-shadow: 0 4px 12px rgba(26,54,43,0.3);
    }

    /* --- HERO SECTION --- */
    .hero {
      text-align: center;
      padding: 80px 20px 40px;
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
    }
    .hero h1 {
      font-size: clamp(40px, 6vw, 72px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    
    .sketch-oval { position: relative; display: inline-block; }
    .sketch-oval svg {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 120%; height: 140%; z-index: -1;
      stroke: var(--accent-blue); stroke-width: 8;
      fill: none; stroke-linecap: round;
      animation: dash 15s linear infinite;
    }
    @keyframes dash { to { stroke-dashoffset: -100; } }

    /* --- DIVIDER LINE --- */
    .divider-container { width: 100%; padding: 0 5%; position: relative; margin-top: 20px; }
    .divider { height: 8px; background-color: var(--text-main); width: 100%; position: relative; }
    .divider::after {
      content: ''; position: absolute; right: 0; top: 0;
      height: 100%; width: 80px; background-color: var(--accent-yellow);
    }

    /* --- FORUM SECTION --- */
    .forum-wrapper {
      max-width: 1200px;
      margin: 60px auto;
      padding: 0 5%;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 40px;
      align-items: start;
    }

    .post-form {
      background: #fff;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 6px 6px 0 var(--border-color);
      position: sticky;
      top: 100px;
      transition: transform 0.2s;
    }
    
    .post-form h2 { font-size: 24px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    
    input, textarea, select {
      width: 100%; padding: 12px 16px;
      border: 2px solid #E0E0E0; border-radius: 8px;
      font-size: 15px; font-family: inherit;
      margin-bottom: 16px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: var(--bg); color: var(--text-main);
    }
    input:focus, textarea:focus, select:focus { 
      border-color: var(--text-main); 
      box-shadow: 0 0 0 3px var(--accent-blue);
    }
    textarea { resize: vertical; min-height: 100px; }

    .btn-submit {
      width: 100%; background: var(--text-main); color: #fff;
      padding: 14px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 800; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover { background: #2a5041; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .btn-submit:disabled { background: #999; cursor: not-allowed; transform: none; }

    /* Feed Header */
    .feed-header { margin-bottom: 24px; }
    .feed-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;}
    .feed-header h2 { font-size: 28px; font-weight: 800; }
    .post-count { font-size: 14px; color: var(--text-muted); font-weight: 600; background: #E0E0E0; padding: 4px 10px; border-radius: 20px; }
    
    /* Search Bar */
    .search-bar {
      width: 100%; padding: 12px 16px;
      border: 2px solid #E0E0E0; border-radius: 30px;
      font-size: 14px; background: #fff; outline: none;
      transition: all 0.2s; margin-bottom: 16px;
    }
    .search-bar:focus { border-color: var(--text-main); box-shadow: 0 0 0 3px var(--accent-blue); }

    /* Filters */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      background: #fff; border: 2px solid #E0E0E0;
      color: var(--text-muted); padding: 8px 16px;
      border-radius: 20px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--text-main); color: var(--text-main); }
    .filter-btn.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }
    .filter-btn[data-filter="Guide"].active { background: var(--accent-yellow); color: var(--text-main); border-color: var(--text-main); }

    .feed-container { display: flex; flex-direction: column; gap: 16px; }

    /* Post Card */
    .post-card {
      background: #fff; border: 2px solid var(--border-color);
      border-radius: 12px; padding: 20px;
      box-shadow: 4px 4px 0 var(--border-color);
      animation: slideUp 0.4s ease-out forwards;
      opacity: 0; transform: translateY(20px);
      transition: all 0.2s;
      position: relative;
    }
    .post-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--border-color); }
    
    .post-card.pinned {
      border-color: #b8a100;
      background: #fffdf0;
    }
    .post-card.pinned::before {
      content: '📌 PINNED GUIDE';
      position: absolute; top: -12px; left: 20px;
      background: var(--accent-yellow); color: var(--text-main);
      font-size: 10px; font-weight: 800; padding: 4px 8px;
      border-radius: 4px; border: 2px solid var(--text-main);
    }

    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

    .post-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .post-user-info { display: flex; align-items: center; gap: 12px; }
    
    /* Avatars */
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: #fff;
      border: 2px solid var(--border-color);
    }
    
    .post-author-details { display: flex; flex-direction: column; gap: 4px; }
    .post-author { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .post-tag { 
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      padding: 2px 6px; border-radius: 4px; background: var(--accent-blue); color: var(--text-main);
    }
    .post-tag.guide { background: var(--accent-yellow); }
    
    .post-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .post-time { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .delete-btn {
      background: var(--accent-red); color: #fff; border: none;
      padding: 4px 8px; border-radius: 4px; font-size: 12px;
      cursor: pointer; display: none;
    }
    .post-content { font-size: 15px; line-height: 1.6; color: var(--text-main); white-space: pre-wrap; }

    @media (max-width: 900px) {
      .forum-wrapper { grid-template-columns: 1fr; }
      .post-form { position: relative; top: 0; }
    }
    @media (max-width: 700px) {
      header { flex-direction: column; gap: 20px; padding: 15px; }
      nav { display: none; }
      .hero h1 { font-size: 38px; }
    }
  </style>
</head>
<body>

  <header id="main-header">
    <div class="logo" onclick="window.scrollTo(0,0)">
      <span class="logo-icon">⚔️</span>
      <span>WARS</span>
    </div>
    <nav>
      <a onclick="setFilter('All')" class="active" id="nav-forum">Forum</a>
      <a onclick="setFilter('Guide')" id="nav-guides">Guides</a>
    </nav>
    <a href="https://guns.lol/devvingwars" target="_blank" class="btn-play">Play WARS</a>
  </header>

  <section class="hero">
    <h1>
      Unlock your <span class="sketch-oval">
        ultimate
        <svg viewBox="0 0 200 80" preserveAspectRatio="none">
          <path d="M 10,40 C 10,10 190,10 190,40 C 190,70 10,70 10,40" />
        </svg>
      </span> 
      WARS experience with the community.
    </h1>
  </section>

  <div class="divider-container">
    <div class="divider"></div>
  </div>

  <section class="forum-wrapper">
    <!-- Left: Form -->
    <div class="post-form">
      <h2><span>✏️</span> Create a Post</h2>
      <form id="forumForm">
        <input type="text" id="username" placeholder="Your Username" required maxlength="20">
        <select id="tag">
          <option value="General">General Chat</option>
          <option value="LFG">LFG (Looking for Group)</option>
          <option value="Bug Report">Bug Report</option>
          <option value="Suggestion">Suggestion</option>
        </select>
        <textarea id="message" placeholder="What's on your mind?" required maxlength="500"></textarea>
        <button type="submit" id="submitBtn" class="btn-submit">Post to Forum</button>
      </form>
    </div>

    <!-- Right: Feed -->
    <div class="feed">
      <div class="feed-header">
        <div class="feed-top-row">
          <h2>Latest Discussions</h2>
          <span class="post-count" id="postCount">0 posts</span>
        </div>
        
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search posts...">
        
        <div class="filters">
          <button class="filter-btn active" data-filter="All" onclick="setFilter('All')">All</button>
          <button class="filter-btn" data-filter="General" onclick="setFilter('General')">General</button>
          <button class="filter-btn" data-filter="LFG" onclick="setFilter('LFG')">LFG</button>
          <button class="filter-btn" data-filter="Bug Report" onclick="setFilter('Bug Report')">Bugs</button>
          <button class="filter-btn" data-filter="Guide" onclick="setFilter('Guide')">✨ Guides</button>
        </div>
      </div>
      
      <div id="feedContainer" class="feed-container">
        <p id="loadingText" style="color: var(--text-muted); font-weight: 600;">Loading posts...</p>
      </div>
    </div>
  </section>

  <script>
    // Supabase Config
    const SUPABASE_URL = "https://rmtzmdjpvzrwrionhdeb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_yNU_5dsH-ZPfRu6MtZLeig_8CQzme9H";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Admin Logic
    const isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';
    if (isAdmin) {
      document.getElementById('tag').innerHTML += '<option value="Guide">✨ Community Guide (Admin)</option>';
      document.getElementById('username').value = "DevvingWars";
    }

    let allPosts = [];
    let currentFilter = "All";
    let searchQuery = "";

    // Avatar Colors
    const pastelColors = ['#FF9F9F', '#FFC89F', '#FFE79F', '#C4FF9F', '#9FFFE0', '#9FC4FF', '#C89FFF', '#FF9FE0'];
    function getAvatarColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return pastelColors[Math.abs(hash) % pastelColors.length];
    }

    async function loadPosts() {
      const feedContainer = document.getElementById('feedContainer');
      const loadingText = document.getElementById('loadingText');
      
      try {
        const { data, error } = await _supabase
          .from('posts')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        
        allPosts = data;
        loadingText.style.display = 'none';
        renderFeed();
      } catch (error) {
        console.error("Error loading posts: ", error);
        loadingText.textContent = "Could not load posts. Check Supabase table.";
      }
    }

    function renderFeed() {
      const feedContainer = document.getElementById('feedContainer');
      const postCount = document.getElementById('postCount');
      feedContainer.innerHTML = '';
      
      // Filter logic
      let filteredPosts = currentFilter === "All" 
        ? allPosts 
        : allPosts.filter(post => post.tag === currentFilter);

      // Search logic
      if (searchQuery) {
        filteredPosts = filteredPosts.filter(post => 
          post.username.toLowerCase().includes(searchQuery) || 
          post.message.toLowerCase().includes(searchQuery)
        );
      }

      // Pin Guides to the top
      filteredPosts.sort((a, b) => {
        if (a.tag === 'Guide' && b.tag !== 'Guide') return -1;
        if (a.tag !== 'Guide' && b.tag === 'Guide') return 1;
        return 0; // Keep chronological order for the rest
      });

      postCount.textContent = `${filteredPosts.length} post${filteredPosts.length === 1 ? '' : 's'}`;

      if (filteredPosts.length === 0) {
        feedContainer.innerHTML = `<p style="color: var(--text-muted); font-weight: 600;">No posts found. Be the first!</p>`;
        return;
      }

      filteredPosts.forEach((post, index) => {
        const dateObj = new Date(post.created_at);
        const date = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        
        const card = document.createElement('div');
        card.className = 'post-card' + (post.tag === 'Guide' ? ' pinned' : '');
        card.style.animationDelay = `${index * 0.05}s`;
        
        const tagClass = post.tag === 'Guide' ? 'post-tag guide' : 'post-tag';
        const initial = post.username.charAt(0).toUpperCase();
        const avatarBg = getAvatarColor(post.username);
        
        card.innerHTML = `
          <div class="post-header">
            <div class="post-user-info">
              <div class="avatar" style="background-color: ${avatarBg}">${initial}</div>
              <div class="post-author-details">
                <div class="post-author">
                  ${escapeHTML(post.username)}
                  <span class="${tagClass}">${post.tag}</span>
                </div>
                <div class="post-time">${date}</div>
              </div>
            </div>
            <div class="post-meta">
              ${isAdmin ? `<button class="delete-btn" onclick="deletePost('${post.id}')">🗑️ Delete</button>` : ''}
            </div>
          </div>
          <div class="post-content">${escapeHTML(post.message)}</div>
        `;
        feedContainer.appendChild(card);
      });
      
      // Show delete buttons if admin
      if (isAdmin) document.querySelectorAll('.delete-btn').forEach(b => b.style.display = 'block');
    }

    document.getElementById('forumForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = "Posting...";

      const username = document.getElementById('username').value.trim();
      const tag = document.getElementById('tag').value;
      const message = document.getElementById('message').value.trim();

      try {
        const { error } = await _supabase
          .from('posts')
          .insert([{ username: username, tag: tag, message: message }]);

        if (error) throw error;
        
        document.getElementById('message').value = '';
        await loadPosts(); 
      } catch (error) {
        alert("Error posting: " + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Post to Forum";
      }
    });

    // Search Input Listener
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      renderFeed();
    });

    // Global function for navigation links
    window.setFilter = function(filterName) {
      currentFilter = filterName;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filterName));
      
      // Update nav underline
      document.getElementById('nav-forum').classList.toggle('active', filterName === 'All');
      document.getElementById('nav-guides').classList.toggle('active', filterName === 'Guide');
      
      renderFeed();
    };

    // Admin Delete Function
    window.deletePost = async function(id) {
      if (!confirm("Are you sure you want to delete this post?")) return;
      try {
        const { error } = await _supabase.from('posts').delete().eq('id', id);
        if (error) throw error;
        await loadPosts();
      } catch (error) {
        alert("Error deleting: " + error.message);
      }
    };

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Header scroll effect
    window.addEventListener('scroll', () => {
      document.getElementById('main-header').classList.toggle('scrolled', window.scrollY > 10);
    });

    loadPosts();
  </script>
</body>
</html>
